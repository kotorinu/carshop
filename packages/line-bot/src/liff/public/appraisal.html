<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>無料査定 | 大阪・外車専門店</title>
    <style>
      :root {
        --navy: #0e2a47;
        --navy-deep: #0a1f36;
        --accent: #1d6fe0;
        --line: #d8dee6;
        --text: #16202c;
        --muted: #6b7785;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
        color: var(--text);
        background: #f4f6f9;
        -webkit-text-size-adjust: 100%;
      }
      .head {
        background: linear-gradient(160deg, var(--navy), var(--navy-deep));
        color: #fff;
        padding: 22px 20px 18px;
      }
      .head .sub { font-size: 12px; opacity: 0.8; letter-spacing: 0.08em; }
      .head h1 { font-size: 20px; margin: 4px 0 0; }
      form { padding: 16px 18px 40px; max-width: 520px; margin: 0 auto; }
      label { display: block; font-size: 14px; font-weight: 700; margin: 16px 0 6px; }
      label .req { color: #d8443c; font-size: 12px; margin-left: 4px; }
      label .opt { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 4px; }
      input, select, textarea {
        width: 100%;
        font-size: 16px; /* iOSズーム防止 */
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--text);
      }
      textarea { min-height: 84px; resize: vertical; }
      .hint { font-size: 12px; color: var(--muted); margin: 6px 2px 0; }
      button {
        width: 100%;
        margin-top: 24px;
        padding: 15px;
        font-size: 16px;
        font-weight: 800;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 12px;
      }
      button:disabled { opacity: 0.5; }
      .note {
        background: #eef3fb;
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 13px;
        color: #2b4a6f;
        margin-top: 12px;
      }
      .state {
        padding: 40px 24px;
        text-align: center;
        max-width: 520px;
        margin: 0 auto;
      }
      .state h2 { font-size: 20px; }
      .state p { color: var(--muted); line-height: 1.7; }
      .err { color: #d8443c; font-size: 13px; margin-top: 10px; min-height: 1em; text-align: center; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="head">
      <div class="sub">大阪・外車専門店</div>
      <h1>愛車の無料査定（約30秒）</h1>
    </div>

    <div id="loading" class="state"><p>読み込み中…</p></div>

    <form id="form" hidden>
      <label>お名前<span class="req">必須</span></label>
      <input name="name" autocomplete="name" required />

      <label>電話番号<span class="req">必須</span></label>
      <input name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="09012345678" required />

      <label>メーカー・車種<span class="req">必須</span></label>
      <input name="carName" placeholder="例：BMW 3シリーズ / ベンツ Cクラス" required />

      <label>年式（西暦）<span class="req">必須</span></label>
      <input name="year" inputmode="numeric" placeholder="例：2019" required />

      <label>走行距離（km）<span class="req">必須</span></label>
      <input name="mileageKm" type="number" inputmode="numeric" min="0" placeholder="例：45000" required />

      <label>車の状態・ご要望<span class="opt">任意</span></label>
      <textarea name="note" placeholder="キズ・修復歴・改造・売却希望時期など"></textarea>

      <button id="submit" type="submit">無料査定を依頼する</button>
      <div id="err" class="err"></div>
      <div class="note">📷 お写真があると査定がより正確になります。送信後、このトークに外装・内装・メーターのお写真を送ってください。</div>
    </form>

    <div id="done" class="state" hidden>
      <h2>査定依頼を受け付けました🚗</h2>
      <p>担当より査定のご連絡をこのトークでお送りします。<br />お写真をこのトークに送っていただくと、より正確にご案内できます。</p>
    </div>

    <div id="config-error" class="state" hidden>
      <h2>準備中です</h2>
      <p>このフォームはまだ設定が完了していません。<br />お手数ですがトークで「査定」とお送りください。</p>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
      const LIFF_ID = "__LIFF_ID__";
      const $ = (id) => document.getElementById(id);

      async function main() {
        if (!LIFF_ID) {
          $("loading").hidden = true;
          $("config-error").hidden = false;
          return;
        }
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
        } catch (e) {
          $("loading").hidden = true;
          $("config-error").hidden = false;
          return;
        }
        $("loading").hidden = true;
        $("form").hidden = false;
      }

      $("form").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        $("err").textContent = "";
        const btn = $("submit");
        btn.disabled = true;
        btn.textContent = "送信中…";
        const f = ev.target;
        const payload = {
          token: liff.getAccessToken(),
          name: f.name.value.trim(),
          phone: f.phone.value.trim(),
          carName: f.carName.value.trim(),
          year: f.year.value.trim(),
          mileageKm: Number(f.mileageKm.value),
          note: f.note.value.trim(),
        };
        try {
          const res = await fetch("/api/appraisal", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok || !data.ok) throw new Error(data.error || "送信に失敗しました");
          $("form").hidden = true;
          $("done").hidden = false;
          if (liff.isInClient()) setTimeout(() => liff.closeWindow(), 2600);
        } catch (e) {
          $("err").textContent = e.message || "送信に失敗しました。時間をおいてお試しください。";
          btn.disabled = false;
          btn.textContent = "無料査定を依頼する";
        }
      });

      main();
    </script>
  </body>
</html>
