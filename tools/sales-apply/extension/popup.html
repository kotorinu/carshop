<!doctype html>
<meta charset="utf-8">
<title>営業応募オートパイロット</title>
<style>
  body { width: 420px; margin: 0; font-family: "Hiragino Sans","Noto Sans JP",system-ui,sans-serif; font-size: 13px; color: #1c1917; background: #fffdfa; }
  header { background: #1c1917; color: #fff; padding: 12px 14px; }
  header b { font-size: 14px; }
  header p { margin: 4px 0 0; font-size: 11px; color: #d6d3d1; }
  .bar { display: flex; gap: 6px; padding: 10px 12px; flex-wrap: wrap; border-bottom: 1px solid #f0ece5; }
  button { padding: 7px 10px; border-radius: 8px; border: 1px solid #1c1917; background: #fff; cursor: pointer; font-size: 12px; font-weight: 700; }
  button.primary { background: #1c1917; color: #fff; }
  .tabs { display: flex; gap: 4px; padding: 8px 12px 0; }
  .tabs button { border: 0; background: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 6px 8px; }
  .tabs button.on { border-bottom-color: #f97316; }
  ul { list-style: none; margin: 0; padding: 8px 12px 14px; display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow: auto; }
  li { border: 1px solid #e7e0d6; border-radius: 9px; padding: 8px 10px; background: #fff; }
  a { color: #1c1917; font-weight: 700; text-decoration: none; font-size: 12.5px; }
  a:hover { text-decoration: underline; }
  .meta { font-size: 11px; color: #78716c; margin-top: 3px; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 10.5px; font-weight: 700; }
  .apply { background: #dcfce7; color: #15803d; } .maybe { background: #fef9c3; color: #a16207; } .skip { background: #fee2e2; color: #b91c1c; }
  .empty { padding: 24px 14px; color: #78716c; font-size: 12px; line-height: 1.9; }
</style>
<header>
  <b>営業応募オートパイロット</b>
  <p>集める → 点数を付ける → 応募文を作る → フォームに入れる。送信だけ自分で押す。</p>
</header>
<div class="bar">
  <button class="primary" id="search">案件を探しに行く</button>
  <button id="inject">このページで起動</button>
  <button id="options">設定</button>
  <button id="csv">CSVで書き出す</button>
</div>
<div class="tabs">
  <button data-tab="apply" class="on">応募推奨</button>
  <button data-tab="all">すべて</button>
  <button data-tab="applied">応募済み</button>
</div>
<ul id="list"></ul>
<script src="popup.js"></script>
