<!doctype html>
<meta charset="utf-8">
<title>営業応募オートパイロット</title>
<style>
  body { width: 440px; margin: 0; font-family: "Hiragino Sans","Noto Sans JP",system-ui,sans-serif; font-size: 13px; color: #1c1917; background: #fffdfa; }
  header { background: #1c1917; color: #fff; padding: 12px 14px; }
  header b { font-size: 14px; }
  header p { margin: 4px 0 0; font-size: 11px; color: #d6d3d1; }
  .hero { padding: 14px; border-bottom: 1px solid #f0ece5; }
  button.big {
    width: 100%; padding: 14px; border-radius: 10px; border: 0; cursor: pointer;
    background: #c2410c; color: #fff; font-size: 15px; font-weight: 700; letter-spacing: .02em;
  }
  button.big:disabled { background: #d6d3d1; cursor: not-allowed; }
  .sub { margin-top: 8px; display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: #78716c; }
  .sub input[type=number] { width: 56px; padding: 4px 6px; border: 1px solid #d6d3d1; border-radius: 6px; font: inherit; }
  .bar { display: flex; gap: 6px; padding: 10px 12px; flex-wrap: wrap; border-bottom: 1px solid #f0ece5; }
  button.s { padding: 6px 10px; border-radius: 8px; border: 1px solid #1c1917; background: #fff; cursor: pointer; font-size: 11.5px; font-weight: 700; }
  .progress { padding: 10px 14px; background: #fff7ed; border-bottom: 1px solid #fed7aa; font-size: 11.5px; line-height: 1.8; }
  .progress b { color: #c2410c; }
  .track { height: 5px; background: #fde3c8; border-radius: 99px; overflow: hidden; margin: 6px 0; }
  .track i { display: block; height: 100%; background: #ea580c; transition: width .3s; }
  .tabs { display: flex; gap: 4px; padding: 8px 12px 0; }
  .tabs button { border: 0; background: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 6px 8px; cursor: pointer; font-size: 12px; }
  .tabs button.on { border-bottom-color: #f97316; font-weight: 700; }
  ul { list-style: none; margin: 0; padding: 8px 12px 14px; display: flex; flex-direction: column; gap: 6px; max-height: 360px; overflow: auto; }
  li { border: 1px solid #e7e0d6; border-radius: 9px; padding: 8px 10px; background: #fff; }
  li.top { border-color: #fdba74; background: #fffbf5; }
  a { color: #1c1917; font-weight: 700; text-decoration: none; font-size: 12.5px; }
  a:hover { text-decoration: underline; }
  .meta { font-size: 11px; color: #78716c; margin-top: 3px; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 10.5px; font-weight: 700; }
  .apply { background: #dcfce7; color: #15803d; } .maybe { background: #fef9c3; color: #a16207; }
  .skip { background: #fee2e2; color: #b91c1c; } .banned { background: #f5f5f4; color: #57534e; }
  .empty { padding: 22px 14px; color: #78716c; font-size: 12px; line-height: 1.9; }
</style>
<header>
  <b>営業応募オートパイロット</b>
  <p>裏で全媒体を回って、詳細まで読んで採点して、合格点のものだけ開きます。</p>
</header>

<div class="hero">
  <button class="big" id="auto">🔍 案件を探して、合格点のものを開く</button>
  <div class="sub">
    <label>合格点 <input type="number" id="minScore" min="0" max="100" step="5"> 点以上</label>
    <label>最大 <input type="number" id="maxOpenTabs" min="1" max="20"> タブ</label>
    <span id="hint"></span>
  </div>
</div>

<div class="progress" id="progress" hidden>
  <b id="pTitle">巡回中…</b>
  <div class="track"><i id="pBar" style="width:0%"></i></div>
  <div id="pLog"></div>
</div>

<div class="bar">
  <button class="s" id="openTop">合格点のものを開き直す</button>
  <button class="s" id="inject">このページで起動</button>
  <button class="s" id="options">設定</button>
  <button class="s" id="csv">CSV</button>
</div>

<div class="tabs">
  <button data-tab="top" class="on">合格</button>
  <button data-tab="all">すべて</button>
  <button data-tab="applied">応募済み</button>
</div>
<ul id="list"></ul>
<script src="popup.js"></script>
