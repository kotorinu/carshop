<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- Instagram/TikTokストーリー用 1080x1920。richmenu/welcome-heroと同一デザイン言語:
     ネイビー1色相グラデ・M PLUS Rounded 1c・白。render-story.cjs でPNG書き出し。
     QRは line-qr.png（/auth/line?ref=instagram_story を実弾検証済み）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .story {
    width: 1080px; height: 1920px;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 140px 80px 120px;
    background: linear-gradient(160deg, #1a3a6e 0%, #122a52 55%, #0c1e3d 100%);
    font-family: "M PLUS Rounded 1c", "Yu Gothic UI", "Yu Gothic", sans-serif;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .story::before {
    content: ""; position: absolute; right: -220px; top: -220px;
    width: 640px; height: 640px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.09);
  }
  .story::after {
    content: ""; position: absolute; left: -180px; bottom: 260px;
    width: 520px; height: 520px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.07);
  }
  .brand { font-size: 34px; font-weight: 700; letter-spacing: .18em; color: rgba(255,255,255,.7); z-index: 1; }
  .title {
    font-size: 76px; font-weight: 800; line-height: 1.3; text-align: center;
    margin-top: 36px; text-shadow: 0 4px 14px rgba(0,0,0,.35); z-index: 1;
  }
  .qr-card {
    margin-top: 90px; background: #fff; border-radius: 40px;
    padding: 48px; box-shadow: 0 20px 60px rgba(0,0,0,.35); z-index: 1;
  }
  .qr-card img { width: 460px; height: 460px; display: block; }
  .scan {
    margin-top: 44px; font-size: 42px; font-weight: 800; letter-spacing: .04em; z-index: 1;
  }
  .sub { margin-top: 12px; font-size: 30px; color: rgba(255,255,255,.75); font-weight: 700; z-index: 1; }
  .info {
    margin-top: auto; width: 100%; z-index: 1;
    border-top: 2px solid rgba(255,255,255,.18);
    padding-top: 44px;
    display: flex; flex-direction: column; gap: 20px; align-items: center;
  }
  .info-row { display: flex; align-items: baseline; gap: 16px; font-size: 32px; font-weight: 700; }
  .info-row .icon { font-size: 34px; }
  .info-row .label { color: rgba(255,255,255,.65); font-weight: 700; }
  .info-row .value { color: #fff; font-weight: 800; }
</style>
</head>
<body>
<div class="story">
  <div class="brand">JUPITER CORING</div>
  <div class="title">LINEで友だち追加<br>在庫・査定・予約が<br>ここから全部できます</div>
  <div class="qr-card"><img src="line-qr.png"></div>
  <div class="scan">📷 スクショしてスキャン</div>
  <div class="sub">タップで直接追加もOK</div>
  <div class="info">
    <div class="info-row"><span class="icon">🕘</span><span class="label">営業時間</span><span class="value">9:00〜19:00（木曜定休）</span></div>
    <div class="info-row"><span class="icon">📍</span><span class="label">住所</span><span class="value">大阪府寝屋川市黒原橘町4-1</span></div>
    <div class="info-row"><span class="icon">📞</span><span class="label">電話</span><span class="value">06-6328-6042</span></div>
  </div>
</div>
</body>
</html>
