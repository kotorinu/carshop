<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- LINE Day0ウェルカムFlexのhero画像 1040x676(20:13)。richmenu.htmlと同一デザイン言語:
     ネイビー1色相グラデ・M PLUS Rounded 1c・白・丸アイコン。welcome-render.cjs でPNG書き出し。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .hero {
    width: 1040px; height: 676px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 30px;
    background: linear-gradient(160deg, #1a3a6e 0%, #122a52 55%, #0c1e3d 100%);
    font-family: "M PLUS Rounded 1c", "Yu Gothic UI", "Yu Gothic", sans-serif;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  /* 背景の飾り: 大きな薄い円（richmenuのアイコン円と同言語） */
  .hero::before {
    content: "";
    position: absolute; right: -160px; top: -160px;
    width: 520px; height: 520px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.10);
  }
  .hero::after {
    content: "";
    position: absolute; left: -120px; bottom: -180px;
    width: 420px; height: 420px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.08);
  }
  .icon {
    width: 148px; height: 148px;
    border-radius: 50%;
    background: rgba(255,255,255,.12);
    border: 4px solid rgba(255,255,255,.55);
    display: flex; align-items: center; justify-content: center;
  }
  .icon svg { width: 84px; height: 84px; stroke: #fff; fill: none; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
  .thanks {
    font-size: 34px; font-weight: 700;
    color: rgba(255,255,255,.85);
    letter-spacing: .12em;
  }
  .main {
    font-size: 78px; font-weight: 800; letter-spacing: .03em;
    text-shadow: 0 4px 14px rgba(0,0,0,.35);
    line-height: 1.25;
    text-align: center;
  }
  .divider {
    width: 90px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,.45);
  }
  .shop {
    font-size: 30px; font-weight: 700;
    color: rgba(255,255,255,.75);
    letter-spacing: .14em;
  }
</style>
</head>
<body>
<div class="hero">
  <div class="icon">
    <!-- クルマ（richmenuと同じ） -->
    <svg viewBox="0 0 64 64">
      <path d="M10 38 L14 26 Q15 22 20 22 L44 22 Q49 22 50 26 L54 38"/>
      <path d="M8 38 H56 Q58 38 58 41 V46 Q58 48 56 48 H8 Q6 48 6 46 V41 Q6 38 8 38 Z"/>
      <circle cx="18" cy="48" r="6"/>
      <circle cx="46" cy="48" r="6"/>
    </svg>
  </div>
  <div class="thanks">友だち追加ありがとうございます</div>
  <div class="main">クルマ、買うのも<br>売るのも。</div>
  <div class="divider"></div>
  <div class="shop">JUPITER CORING｜大阪・寝屋川の中古車販売店</div>
</div>
</body>
</html>
